schema = 1

[framework]
version = "0.1.0"
stability = "experimental"
rust = "1.96.0"
surrealdb = "3.2.3"

[legal]
license = "AGPL-3.0-only"
approved_candidate = "v0.1.0"
frust_desk_commit = "c4199e3c7d4de3477421d07bb30dd2aa3e22bb10"
frust_ui_commit = "5bd43949cc24492ae244316a291055cc5f532ac7"
topcoat_commit = "082303f1cf2b938883846c1ecef53901765810cb"

[application]
manifest_version = 1
version_syntax = "MAJOR.MINOR.PATCH"

[api]
rest_major = 1
policy = "frust-kernel/docs/evolution-policy.md"

[wasm]
target = "wasm32-wasip2"
wit_package = "frust:plugin"
worlds = ["plugin", "route-plugin", "lifecycle-plugin"]
artifact_lock = "wasm-spike/artifacts.lock.json"

[build]
pnpm = "11.1.2"
jco_transpile = "0.5.2"
lockfiles_required = true
