schema = 1

[framework]
version = "0.1.0"
stability = "experimental"
rust = "1.96.0"
surrealdb = "3.2.3"

[legal]
license = "AGPL-3.0-only"
approved_candidate = "v0.1.0-rc.3"
frust_desk_commit = "4d3c8eb6534c1d85c19ae206e6652073b8fd9aec"
frust_ui_commit = "a80b84004880d20534c6313f326d874dffcf94be"
topcoat_commit = "082303f1cf2b938883846c1ecef53901765810cb"

[application]
manifest_version = 1
version_syntax = "MAJOR.MINOR.PATCH"

[api]
rest_major = 1
policy = "frust-kernel/docs/evolution-policy.md"

[wasm]
target = "wasm32-wasip2"
wit_package = "frust:plugin"
worlds = ["plugin", "route-plugin", "lifecycle-plugin"]
artifact_lock = "wasm-spike/artifacts.lock.json"

[build]
pnpm = "11.1.2"
jco_transpile = "0.5.2"
lockfiles_required = true
