name: Dependency security

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - ".github/workflows/**"
      - "deploy/Dockerfile*"
  schedule:
    - cron: "31 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rustsec:
    name: RustSec (${{ matrix.directory }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        directory:
          - frust-kernel
          - frust-desk
          - wasm-spike/script-engine
          - wasm-spike/plugin-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.directory }}
