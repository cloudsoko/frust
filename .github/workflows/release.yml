name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact tag and recorded submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Enforce tag, metadata, and legal readiness
        run: python .github/scripts/release-preflight.py --tag "${GITHUB_REF_NAME}" --require-license --skip-artifacts

  runtime-artifacts:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact tag and recorded submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache runtime artifact build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            wasm-spike/script-engine
            wasm-spike/plugin-demo
          key: release-runtime-artifacts
      - name: Install pinned Node and pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
      - name: Activate pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@11.1.2
      - name: Rebuild locked runtime artifacts
        shell: pwsh
        run: ./scripts/frust.ps1 build-artifacts
      - name: Verify release metadata and runtime checksums
        run: python .github/scripts/release-preflight.py --tag "${GITHUB_REF_NAME}" --require-license
      - name: Refuse generated artifact drift
        run: git diff --exit-code -- wasm-spike/artifacts frust-desk/assets/engine wasm-spike/artifacts.lock.json
      - name: Upload verified runtime inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-inputs
          path: |
            wasm-spike/artifacts/script_engine.wasm
            wasm-spike/artifacts/plugin_demo.wasm
          if-no-files-found: error
          retention-days: 1

  build:
    needs: runtime-artifacts
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
            executable_suffix: ""
          - runner: windows-latest
            label: windows-x86_64
            executable_suffix: ".exe"
    steps:
      - name: Check out the exact tag and recorded submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            frust-kernel
            frust-desk
          key: release-${{ matrix.label }}

      - name: Download verified runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-runtime-inputs
          path: wasm-spike/artifacts

      - name: Verify release metadata and runtime checksums
        shell: pwsh
        run: python .github/scripts/release-preflight.py --tag "${{ github.ref_name }}" --require-license

      - name: Refuse generated artifact drift
        shell: pwsh
        run: |
          git diff --exit-code -- wasm-spike/artifacts frust-desk/assets/engine wasm-spike/artifacts.lock.json
          if ($LASTEXITCODE -ne 0) { throw "release artifacts are not reproducible" }

      - name: Build locked release binaries
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Linux") {
            docker run --rm --volume "${PWD}:/src" --workdir /src rust:1.96.0-bookworm `
              bash -euc 'cargo build --manifest-path frust-kernel/Cargo.toml --package frust-kernel --release --locked --jobs 2; cargo build --manifest-path frust-desk/Cargo.toml --release --locked --jobs 2'
          } else {
            cargo build --manifest-path frust-kernel/Cargo.toml --package frust-kernel --release --locked --jobs 2
            if ($LASTEXITCODE -ne 0) { throw "kernel release build failed" }
            cargo build --manifest-path frust-desk/Cargo.toml --release --locked --jobs 2
          }
          if ($LASTEXITCODE -ne 0) { throw "release binary build failed" }

      - name: Stage release payload
        shell: pwsh
        run: |
          $stage = "dist/frust-${{ github.ref_name }}-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path "$stage/bin", "$stage/runtime", "$stage/release", "$stage/licenses" | Out-Null
          Copy-Item "frust-kernel/target/release/frust${{ matrix.executable_suffix }}" "$stage/bin/"
          Copy-Item "frust-desk/target/release/frust-desk${{ matrix.executable_suffix }}" "$stage/bin/"
          Copy-Item "wasm-spike/artifacts/script_engine.wasm" "$stage/runtime/"
          Copy-Item "wasm-spike/artifacts/plugin_demo.wasm" "$stage/runtime/"
          Copy-Item "frust-desk/assets/engine/script_engine.js" "$stage/runtime/"
          Copy-Item "frust-desk/assets/engine/script_engine.core.wasm" "$stage/runtime/"
          Copy-Item "release/compatibility.toml" "$stage/release/"
          Copy-Item "deploy/recovery-runbook.md" "$stage/release/"
          Copy-Item "LICENSE" "$stage/licenses/FRUST-AGPL-3.0.txt"
          Copy-Item "NOTICE" "$stage/licenses/FRUST-NOTICE.txt"
          Copy-Item "frust-desk/LICENSE" "$stage/licenses/FRUST-DESK-AGPL-3.0.txt"
          Copy-Item "frust-desk/NOTICE" "$stage/licenses/FRUST-DESK-NOTICE.txt"
          Copy-Item "topcoat/LICENSE" "$stage/licenses/TOPCOAT-MIT.txt"
          Copy-Item "deploy/licenses/SURREALDB-BSL-1.1.txt" "$stage/licenses/SURREALDB-BSL-1.1.txt"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/frust-${{ github.ref_name }}-${{ matrix.label }}
          format: spdx-json
          output-file: dist/frust-${{ github.ref_name }}-${{ matrix.label }}/release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Archive and checksum payload
        shell: pwsh
        run: |
          $name = "frust-${{ github.ref_name }}-${{ matrix.label }}"
          Copy-Item "dist/$name/release/sbom.spdx.json" "dist/$name.sbom.spdx.json"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii -NoNewline

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release payload with GitHub OIDC
        shell: pwsh
        run: |
          $name = "frust-${{ github.ref_name }}-${{ matrix.label }}"
          cosign sign-blob --yes --bundle "dist/$name.zip.sigstore.json" "dist/$name.zip"
          if ($LASTEXITCODE -ne 0) { throw "archive signing failed" }
          cosign sign-blob --yes --bundle "dist/$name.sbom.spdx.json.sigstore.json" "dist/$name.sbom.spdx.json"
          if ($LASTEXITCODE -ne 0) { throw "SBOM signing failed" }

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.zip
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.zip.sha256
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.sbom.spdx.json

      - name: Upload locked release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.zip
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.zip.sha256
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.zip.sigstore.json
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.sbom.spdx.json
            dist/frust-${{ github.ref_name }}-${{ matrix.label }}.sbom.spdx.json.sigstore.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signed payloads before publishing
        shell: bash
        run: |
          set -euo pipefail
          identity='^https://github\.com/cloudsoko/frust/\.github/workflows/release\.yml@refs/tags/v[0-9].*$'
          issuer='https://token.actions.githubusercontent.com'
          for payload in dist/*.zip dist/*.sbom.spdx.json; do
            cosign verify-blob \
              --bundle "${payload}.sigstore.json" \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              "${payload}"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Frust ${GITHUB_REF_NAME}" \
            $prerelease

  staging:
    needs: publish
    uses: ./.github/workflows/stage-candidate.yml
    with:
      tag: ${{ github.ref_name }}
      orchestration_sha: ${{ github.sha }}
    permissions:
      contents: read
      attestations: read
