name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  # The two-job cap is a developer-machine OOM guard. Hosted CI has four
  # cores and runs isolated work streams, so use the runner instead of
  # serializing every Rust build.
  CARGO_BUILD_JOBS: "4"

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      artifacts: ${{ steps.classify.outputs.artifacts }}
      auth-matrix: ${{ steps.classify.outputs.auth_matrix }}
      live-matrix: ${{ steps.classify.outputs.live_matrix }}
    steps:
      - name: Check out history for complete path classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths and CI tier
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/ci-changes.py

  governance:
    name: Governance and formatting
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Validate release metadata
        run: |
          python .github/scripts/release-preflight.py --require-license --skip-artifacts --check-public-submodules
          python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Validate maturity ledger
        run: |
          python scripts/validate_maturity.py --check
          python -m unittest maturity.test_validate_maturity
      - name: Check newly governed Rust formatting
        run: |
          cargo fmt --manifest-path frust-kernel/Cargo.toml --package frust-app-sdk -- --check
          rustfmt --edition 2021 --check \
            frust-kernel/kernel/src/http_contract.rs \
            frust-kernel/kernel/src/recovery.rs

  artifacts:
    name: Runtime artifacts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore lock-bound runtime components
        id: runtime-components
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: wasm-spike/artifacts
          key: ${{ runner.os }}-runtime-components-${{ hashFiles('wasm-spike/artifacts.lock.json') }}
      - name: Install pinned Rust toolchain
        if: needs.changes.outputs.artifacts == 'true' || steps.runtime-components.outputs.cache-hit != 'true'
        run: rustup show active-toolchain
      - name: Cache runtime artifact build outputs
        if: needs.changes.outputs.artifacts == 'true' || steps.runtime-components.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            wasm-spike/script-engine
            wasm-spike/plugin-demo
          key: runtime-artifacts
      - name: Install pinned Node and pnpm
        if: needs.changes.outputs.artifacts == 'true' || steps.runtime-components.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
      - name: Activate pnpm
        if: needs.changes.outputs.artifacts == 'true' || steps.runtime-components.outputs.cache-hit != 'true'
        run: corepack enable && corepack install --global pnpm@11.1.2
      - name: Rebuild runtime artifacts when inputs changed or the cache is empty
        if: needs.changes.outputs.artifacts == 'true' || steps.runtime-components.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/frust.ps1 build-artifacts
      - name: Verify all runtime artifact checksums
        run: python .github/scripts/release-preflight.py --require-license
      - name: Refuse generated artifact drift
        run: git diff --exit-code -- wasm-spike/artifacts frust-desk/assets/engine wasm-spike/artifacts.lock.json
      - name: Upload verified runtime inputs for live jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-runtime-inputs
          path: wasm-spike/artifacts/*.wasm
          if-no-files-found: error
          retention-days: 1

  lint-kernel:
    name: Lint kernel
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache kernel lint outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frust-kernel
          key: lint-kernel
      - name: Lint kernel workspace
        run: >-
          cargo clippy --manifest-path frust-kernel/Cargo.toml --workspace --all-targets --locked --
          -D clippy::correctness -D clippy::suspicious

  offline-tests:
    name: Offline tests
    needs: [changes, artifacts]
    if: needs.changes.outputs.code == 'true' && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache offline test outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frust-kernel -> ../test/cargo-target
          key: offline-tests
      - name: Download verified runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-runtime-inputs
          path: wasm-spike/artifacts
      - name: Verify runtime inputs
        run: python .github/scripts/release-preflight.py
      - name: Run bounded database-free tests
        shell: pwsh
        run: ./scripts/test.ps1 -Lane offline -TimeoutSeconds 1200 -TestThreads 4

  desk:
    name: Desk lint and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Desk build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frust-desk
          key: desk
      - name: Lint Desk
        run: >-
          cargo clippy --manifest-path frust-desk/Cargo.toml --all-targets --locked --
          -D clippy::correctness -D clippy::suspicious
      - name: Run Desk unit tests
        run: cargo test --manifest-path frust-desk/Cargo.toml --locked --jobs 4

  quality:
    name: Static, unit, and reproducibility
    needs: [changes, governance, artifacts, lint-kernel, offline-tests, desk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable quality lane
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
          LINT_KERNEL: ${{ needs.lint-kernel.result }}
          OFFLINE_TESTS: ${{ needs.offline-tests.result }}
          DESK: ${{ needs.desk.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [[ "$CODE" = true ]]; then
            for result in "$GOVERNANCE" "$ARTIFACTS" "$LINT_KERNEL" "$OFFLINE_TESTS" "$DESK"; do
              test "$result" = success
            done
          fi

  live-jwt-workers:
    name: Live JWT worker (${{ matrix.lane }}, ${{ matrix.shard_label }})
    needs: [changes, artifacts]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.changes.outputs.code != 'true' || needs.artifacts.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.live-matrix) }}
    env:
      FRUST_ROOT_AUTH: jwt
      FRUST_DB_ENDPOINT: http://127.0.0.1:8899
      FRUST_DB_ROOT_USER: root
      FRUST_DB_ROOT_PASS: root
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run live worker
        uses: ./.github/actions/live-worker
        with:
          code: ${{ needs.changes.outputs.code }}
          root-auth: jwt
          lane: ${{ matrix.lane }}
          shard-index: ${{ matrix.shard_index }}
          shard-count: ${{ matrix.shard_count }}

  live-basic-workers:
    name: Live Basic worker (${{ matrix.lane }}, ${{ matrix.shard_label }})
    needs: [changes, artifacts]
    if: >-
      always() && github.event_name != 'pull_request' && needs.changes.result == 'success' &&
      (needs.changes.outputs.code != 'true' || needs.artifacts.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.live-matrix) }}
    env:
      FRUST_ROOT_AUTH: basic
      FRUST_DB_ENDPOINT: http://127.0.0.1:8899
      FRUST_DB_ROOT_USER: root
      FRUST_DB_ROOT_PASS: root
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Run live worker
        uses: ./.github/actions/live-worker
        with:
          code: ${{ needs.changes.outputs.code }}
          root-auth: basic
          lane: ${{ matrix.lane }}
          shard-index: ${{ matrix.shard_index }}
          shard-count: ${{ matrix.shard_count }}

  live-integration-jwt:
    name: Live integration (jwt)
    needs: [changes, live-jwt-workers]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every JWT worker
        env:
          WORKERS: ${{ needs.live-jwt-workers.result }}
        run: test "$WORKERS" = success

  live-integration-basic:
    name: Live integration (basic)
    needs: [changes, live-basic-workers]
    if: always() && github.event_name != 'pull_request' && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Basic worker
        env:
          WORKERS: ${{ needs.live-basic-workers.result }}
        run: test "$WORKERS" = success
