name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    name: Static, unit, and reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out recorded source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out recorded submodules
        uses: ./.github/actions/private-submodules
        with:
          frust-desk-key: ${{ secrets.FRUST_DESK_CI_DEPLOY_KEY }}
          frust-ui-key: ${{ secrets.FRUST_UI_CI_DEPLOY_KEY }}

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            frust-kernel
            frust-desk
            wasm-spike/script-engine
            wasm-spike/plugin-demo

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: pnpm
          cache-dependency-path: wasm-spike/pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack enable && corepack install --global pnpm@11.1.2

      - name: Validate release metadata
        run: python .github/scripts/release-preflight.py --skip-artifacts

      - name: Validate maturity ledger
        run: |
          python scripts/validate_maturity.py --check
          python -m unittest maturity.test_validate_maturity

      - name: Rebuild and compare runtime artifacts
        shell: pwsh
        run: ./scripts/frust.ps1 build-artifacts

      - name: Verify all runtime artifact checksums
        run: python .github/scripts/release-preflight.py

      - name: Refuse generated artifact drift
        run: git diff --exit-code -- wasm-spike/artifacts frust-desk/assets/engine wasm-spike/artifacts.lock.json

      - name: Check newly governed Rust formatting
        run: |
          cargo fmt --manifest-path frust-kernel/Cargo.toml --package frust-app-sdk -- --check
          rustfmt --edition 2021 --check \
            frust-kernel/kernel/src/http_contract.rs \
            frust-kernel/kernel/src/recovery.rs

      - name: Lint kernel workspace
        run: >-
          cargo clippy --manifest-path frust-kernel/Cargo.toml --workspace --all-targets --locked --
          -D clippy::correctness -D clippy::suspicious

      - name: Run bounded database-free tests
        shell: pwsh
        run: ./scripts/test.ps1 -Lane offline -TimeoutSeconds 1200 -TestThreads 2

      - name: Lint Desk
        run: >-
          cargo clippy --manifest-path frust-desk/Cargo.toml --all-targets --locked --
          -D clippy::correctness -D clippy::suspicious

      - name: Run Desk unit tests
        run: cargo test --manifest-path frust-desk/Cargo.toml --locked --jobs 2

      - name: Upload verified runtime inputs for live jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-runtime-inputs
          path: wasm-spike/artifacts/*.wasm
          if-no-files-found: error
          retention-days: 1

  live-integration:
    name: Live integration (${{ matrix.root-auth }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        root-auth: [jwt, basic]
    env:
      FRUST_ROOT_AUTH: ${{ matrix.root-auth }}
      FRUST_DB_ENDPOINT: http://127.0.0.1:8899
      FRUST_DB_ROOT_USER: root
      FRUST_DB_ROOT_PASS: root
    steps:
      - name: Check out recorded source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out recorded submodules
        uses: ./.github/actions/private-submodules
        with:
          frust-desk-key: ${{ secrets.FRUST_DESK_CI_DEPLOY_KEY }}
          frust-ui-key: ${{ secrets.FRUST_UI_CI_DEPLOY_KEY }}

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: frust-kernel
          key: integration-${{ matrix.root-auth }}

      - name: Download verified runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-runtime-inputs
          path: wasm-spike/artifacts

      - name: Verify runtime inputs
        run: python .github/scripts/release-preflight.py

      - name: Run bounded hermetic live tests
        shell: pwsh
        run: ./scripts/test.ps1 -Lane live -TimeoutSeconds 2400 -TestThreads 2
