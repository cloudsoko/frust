name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_BUILD_JOBS: "4"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/ci-changes.py

  governance:
    name: Metadata and formatting
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate release metadata
        run: |
          python .github/scripts/release-preflight.py --require-license --skip-artifacts --check-public-submodules
          python -m unittest discover -s .github/scripts -p "test_*.py"
      - name: Validate maturity ledger
        run: |
          python scripts/validate_maturity.py --check
          python -m unittest maturity.test_validate_maturity
      - name: Check governed Rust formatting
        run: |
          cargo fmt --manifest-path frust-kernel/Cargo.toml --package frust-app-sdk -- --check
          rustfmt --edition 2021 --check \
            frust-kernel/kernel/src/http_contract.rs \
            frust-kernel/kernel/src/recovery.rs

  kernel:
    name: Kernel compile and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Cache kernel outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frust-kernel
          key: lint-kernel
      - name: Compile and lint all kernel targets
        run: >-
          cargo clippy --manifest-path frust-kernel/Cargo.toml --workspace --all-targets --locked --
          -D clippy::correctness -D clippy::suspicious

  desk:
    name: Desk lint and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Cache Desk outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frust-desk
          key: desk
      - name: Lint Desk
        run: >-
          cargo clippy --manifest-path frust-desk/Cargo.toml --all-targets --locked --
          -D clippy::correctness -D clippy::suspicious
      - name: Run Desk unit tests
        run: cargo test --manifest-path frust-desk/Cargo.toml --locked --jobs 4

  checks:
    name: Checks
    needs: [changes, governance, kernel, desk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require applicable fast checks
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          KERNEL: ${{ needs.kernel.result }}
          DESK: ${{ needs.desk.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [[ "$CODE" = true ]]; then
            for result in "$GOVERNANCE" "$KERNEL" "$DESK"; do
              test "$result" = success
            done
          fi
