name: Deploy release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable published release tag (rc or final)
        required: true
        type: string

permissions:
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/stage-candidate.yml
    with:
      tag: ${{ inputs.tag }}
      orchestration_sha: ${{ github.sha }}
    permissions:
      contents: read
      attestations: read
