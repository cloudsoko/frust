name: Deploy release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable published release-candidate tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: staging
    permissions:
      contents: read
      attestations: read
    env:
      CANDIDATE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Enforce candidate approval and legal readiness
        run: python .github/scripts/release-preflight.py --tag "$CANDIDATE_TAG" --require-license --skip-artifacts

      - name: Download the published signed Linux payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          gh release download $env:CANDIDATE_TAG `
            --repo "${{ github.repository }}" `
            --pattern "frust-$env:CANDIDATE_TAG-linux-x86_64*" `
            --dir dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signatures, checksum, and provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "frust-$env:CANDIDATE_TAG-linux-x86_64"
          $archive = "dist/$name.zip"
          $identity = '^https://github\.com/cloudsoko/frust/\.github/workflows/release\.yml@refs/tags/v[0-9].*$'
          $issuer = 'https://token.actions.githubusercontent.com'
          $checksum = ((Get-Content "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $checksum) { throw "release archive checksum mismatch" }
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity-regexp $identity --certificate-oidc-issuer $issuer $archive
          if ($LASTEXITCODE -ne 0) { throw "release archive signature verification failed" }
          cosign verify-blob --bundle "dist/$name.sbom.spdx.json.sigstore.json" --certificate-identity-regexp $identity --certificate-oidc-issuer $issuer "dist/$name.sbom.spdx.json"
          if ($LASTEXITCODE -ne 0) { throw "release SBOM signature verification failed" }
          gh attestation verify $archive --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "release provenance verification failed" }
          Expand-Archive -LiteralPath $archive -DestinationPath staging/payload

      - name: Prepare the pre-release baseline checkout
        shell: pwsh
        run: |
          $candidate = (git rev-list -n 1 $env:CANDIDATE_TAG).Trim()
          $baseline = (git rev-parse "$candidate^1").Trim()
          "CANDIDATE_COMMIT=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BASELINE_COMMIT=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global url."${{ github.server_url }}/".insteadOf git@github.com:
          git clone "${{ github.server_url }}/${{ github.repository }}.git" staging/baseline
          git -C staging/baseline checkout --detach $baseline
          git -C staging/baseline submodule update --init --recursive

      - name: Deploy, upgrade, rollback, and restore in staging
        shell: pwsh
        run: |
          ./scripts/staging-drill.ps1 `
            -Tag $env:CANDIDATE_TAG `
            -Commit "$env:CANDIDATE_COMMIT" `
            -BaselineCommit "$env:BASELINE_COMMIT" `
            -BaselineCheckout staging/baseline `
            -PayloadDirectory staging/payload `
            -EvidenceDirectory staging/evidence `
            -ProjectName "frust-rc-${{ github.run_id }}" `
            -DeskPort 3300

      - name: Upload staging and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-evidence-${{ inputs.tag }}-${{ github.run_id }}
          path: staging/evidence
          if-no-files-found: error
          retention-days: 90
