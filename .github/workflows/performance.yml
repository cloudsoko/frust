name: Advisory performance evidence and destructive drills

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  FRUST_ROOT_AUTH: basic
  FRUST_DB_ENDPOINT: http://127.0.0.1:8899
  FRUST_DB_ROOT_USER: root
  FRUST_DB_ROOT_PASS: root

jobs:
  advisory-measured-gates:
    name: Advisory performance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out recorded source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build outputs for advisory measurements
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frust-kernel
          key: advisory-measured-gates

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0

      - name: Activate pnpm
        run: corepack enable && corepack install --global pnpm@11.1.2

      - name: Rebuild and verify runtime inputs
        shell: pwsh
        run: |
          ./scripts/frust.ps1 build-artifacts
          python .github/scripts/release-preflight.py

      - name: Start pinned SurrealDB for advisory measurements
        run: |
          docker run --detach --name frust-surreal --publish 127.0.0.1:8899:8000 \
            surrealdb/surrealdb:v3.2.3 start --user root --pass root memory
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8899/health >/dev/null && break
            if [ "$attempt" = 60 ]; then docker logs frust-surreal; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8899/version |
            grep -Eq '^surrealdb-3\.2\.3(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

      # Shared runners cannot guarantee a quiet machine. Even with this run's
      # fresh store, measurements are advisory; authoritative performance numbers
      # come from dedicated local runs on a quiet machine with a fresh store.
      - name: Run advisory release-mode ignored measurement gates
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --manifest-path frust-kernel/Cargo.toml --release --test fuel_overhead --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee fuel-overhead.log
          cargo test --manifest-path frust-kernel/Cargo.toml --release --test live_tax_curve --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee live-tax-curve.log
          cargo test --manifest-path frust-kernel/Cargo.toml --release --test mail_notifications --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee mail-notifications.log
          cargo test --manifest-path frust-kernel/Cargo.toml --release --test tenant_fairness --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee tenant-fairness.log

      - name: Capture advisory SurrealDB diagnostics
        if: always()
        run: docker logs frust-surreal > surrealdb.log 2>&1

      - name: Upload advisory measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ github.run_id }}
          path: |
            fuel-overhead.log
            live-tax-curve.log
            mail-notifications.log
            tenant-fairness.log
            surrealdb.log
          if-no-files-found: warn
          retention-days: 30
