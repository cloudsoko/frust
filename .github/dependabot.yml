    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /frust-kernel
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /frust-desk
    schedule: { interval: weekly }
