name: Check out private submodules
description: Resolve Frust's pinned private submodules with repository-scoped deploy keys.

inputs:
  frust-desk-key:
    description: Read-only deploy key for cloudsoko/frust-desk.
    required: true
  frust-ui-key:
    description: Read-only deploy key for cloudsoko/frust-ui.
    required: true

runs:
  using: composite
  steps:
    - name: Initialize pinned submodules
      shell: bash
      env:
        FRUST_DESK_CI_DEPLOY_KEY: ${{ inputs.frust-desk-key }}
        FRUST_UI_CI_DEPLOY_KEY: ${{ inputs.frust-ui-key }}
      run: |
        set -euo pipefail

        if [[ -z "${FRUST_DESK_CI_DEPLOY_KEY}" || -z "${FRUST_UI_CI_DEPLOY_KEY}" ]]; then
          echo "Private submodule deploy keys are not available." >&2
          exit 1
        fi

        key_dir="${RUNNER_TEMP}/frust-submodule-keys"
        install -d -m 700 "${key_dir}"
        cleanup() {
          rm -f "${key_dir}/frust-desk" "${key_dir}/frust-ui" \
            "${key_dir}/known_hosts" "${key_dir}/config"
          rmdir "${key_dir}" 2>/dev/null || true
        }
        trap cleanup EXIT

        printf '%s\n' "${FRUST_DESK_CI_DEPLOY_KEY}" > "${key_dir}/frust-desk"
        printf '%s\n' "${FRUST_UI_CI_DEPLOY_KEY}" > "${key_dir}/frust-ui"
        chmod 600 "${key_dir}/frust-desk" "${key_dir}/frust-ui"
        ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "${key_dir}/known_hosts" 2>/dev/null

        cat > "${key_dir}/config" <<EOF
        Host github-frust-desk
          HostName github.com
          User git
          IdentityFile ${key_dir}/frust-desk
          IdentitiesOnly yes
          UserKnownHostsFile ${key_dir}/known_hosts
        Host github-frust-ui
          HostName github.com
          User git
          IdentityFile ${key_dir}/frust-ui
          IdentitiesOnly yes
          UserKnownHostsFile ${key_dir}/known_hosts
        EOF
        chmod 600 "${key_dir}/config"

        git submodule init
        git config submodule.frust-desk.url git@github-frust-desk:cloudsoko/frust-desk.git
        git config submodule.frust-ui.url git@github-frust-ui:cloudsoko/frust-ui.git
        git config submodule.topcoat.url https://github.com/cloudsoko/topcoat.git
        GIT_SSH_COMMAND="ssh -F ${key_dir}/config" git submodule update --recursive
