[workspace]
resolver = "2"
members = ["app-sdk", "kernel", "orm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
repository = "https://github.com/cloudsoko/frust"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = "1"
serde_json = "1"
tokio = "1"
ureq = "3.3"
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"

[profile.dev]
debug = 0
